name: Validate ChittyMarket

on:
  # No `paths:` filter. These jobs are required status checks on main
  # (see SECURITY.md), and a path-filtered workflow can leave a PR waiting for
  # a required check that never reports. Validate every PR, then validate main
  # after merge. Do not also run on feat/** pushes: that duplicates PR CI and
  # consumes private-repo Actions minutes without adding a distinct release gate.
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: validate-chittymarket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint + test + manifest idempotency
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      # 1. Plugin lint: every plugin has a valid .claude-plugin/plugin.json,
      #    dependencies resolve, hook configs parse, profiles.json validates.
      - name: scripts/lint-plugins.sh
        run: bash scripts/lint-plugins.sh

      - name: OpenAI workspace marketplace validation
        run: python3 scripts/validate-openai-workspace.py

      # Bootstrap pointers and OpenAI skill metadata are generated from the
      # canonical skill. Re-generation must be byte-for-byte idempotent.
      - name: Bootstrap projection idempotency
        run: |
          chmod +x scripts/generate-bootstrap-pointers.sh scripts/generate-legal-bootstrap.sh
          bash scripts/generate-bootstrap-pointers.sh all
          if ! git diff --quiet -- \
            plugins/chittyos-legal/bootstrap/legal-operating-defaults \
            plugins/chittyos-legal/skills/legal-operating-defaults/agents/openai.yaml \
            plugins/chittyos-finance/bootstrap/finance-operating-defaults \
            plugins/chittyos-finance/skills/finance-operating-defaults/agents/openai.yaml; then
            echo "::error::Bootstrap/OpenAI projections are out of sync with canonical skills."
            echo "Run 'bash scripts/generate-bootstrap-pointers.sh all' and commit the generated files."
            git diff -- \
              plugins/chittyos-legal/bootstrap/legal-operating-defaults \
              plugins/chittyos-legal/skills/legal-operating-defaults/agents/openai.yaml \
              plugins/chittyos-finance/bootstrap/finance-operating-defaults \
              plugins/chittyos-finance/skills/finance-operating-defaults/agents/openai.yaml
            exit 1
          fi
          echo "✓ Bootstrap/OpenAI projections are idempotent"

      # Existing materialized capability views are generated from the overlay.
      # Preserve their committed provenance date during CI and fail on drift.
      - name: Capability view idempotency
        run: |
          python3 scripts/generate-capability-views.py
          if ! git diff --quiet -- \
            views/by-job.json \
            views/by-channel.json \
            views/by-context-cost.json \
            views/by-authority.json; then
            echo "::error::Materialized capability views are stale."
            echo "Run 'python3 scripts/generate-capability-views.py --generated-at YYYY-MM-DD' and commit the views."
            git diff -- views/by-job.json views/by-channel.json views/by-context-cost.json views/by-authority.json
            exit 1
          fi
          echo "✓ Materialized capability views are idempotent"

      # 1b. Matter-leak gate: no concrete legal matter may appear in a governed,
      #     published definition (legal-operating-defaults §15). Shape-matching only —
      #     the gate never learns which matters are real, because a denylist of real
      #     matters would itself be matter data in a public repo.
      - name: scripts/check-matter-leak.py
        run: python3 scripts/check-matter-leak.py

      # 2. Plugin tests: SKILL.md headers, agent file shapes, MCP configs,
      #    plugins/ tree matches .claude-plugin/marketplace.json.
      - name: scripts/test-plugins.sh
        run: bash scripts/test-plugins.sh

      # 2b. Overlay coverage: capabilities.generated.json must project EVERY
      #     real (non-_comment) artifact in marketplace.json, with no orphan
      #     records and a consistent .total. Prevents the overlay from silently
      #     drifting behind the inventory (the CLAUDE.md "projects every
      #     artifact" invariant).
      - name: scripts/check-overlay-coverage.sh
        run: bash scripts/check-overlay-coverage.sh

      # 2c. §16 schema contract: every capabilities.generated.json record must
      #     satisfy the Canonical Capability Record schema (required fields,
      #     enum domains, chittycanon URI shape, P/L/T/E/A ontology, unique ids).
      - name: scripts/validate-overlay-schema.py
        run: python3 scripts/validate-overlay-schema.py

      # 2d. Source-link freshness: every marketplace://artifact/<id> must
      #     resolve to a real artifact and every local://<repo-path> must exist.
      #     (local://~/ home paths and ch1tty:// serverIds are non-gating; the
      #     latter is probed report-only via --live outside CI.)
      - name: scripts/check-source-freshness.sh
        run: bash scripts/check-source-freshness.sh

      # 2e. Content provenance: every record carries a SHA-256 content_hash over
      #     its canonical form; verify recomputes and fails on tamper/drift. This
      #     is the content-addressing substrate the signing/trust layer binds to.
      - name: scripts/overlay-provenance.py verify
        run: python3 scripts/overlay-provenance.py verify

      - name: ChittyMarket document contract
        run: python3 scripts/check-document-contract.py

      - name: Market reconcile regression tests
        run: bash scripts/tests/test-market-reconcile.sh

      # Offline: AI Gateway route-list lookup (apply-gateway-route.sh) against
      # real CF response shapes; unknown shape must exit 2, never "absent".
      - name: Market office regression tests (preflight/publish/retire gates)
        run: bash scripts/tests/test-market-office.sh

      - name: Gateway route lookup tests
        run: bash scripts/tests/test-gateway-route-lookup.sh

      - name: Dispatch state regression tests
        run: |
          bash -n plugins/chittyagent-dispatch/scripts/dispatch.sh
          python3 -m py_compile plugins/chittyagent-dispatch/scripts/lib/state.py
          python3 scripts/tests/test_dispatch_state.py
          python3 scripts/tests/test_dispatch_workflow.py

      # Gauntlet core (canonical/workflows/gauntlet.core.js) — the single source tier 1 inlines
      # and tier 2 vendors. The runner asserts every golden case and fails on a coverage gap;
      # the derive check proves the committed fixtures are still exactly what the PRE-refactor
      # script produced (so no expectation was hand-edited to fit). The pinned commit is fetched
      # by SHA because the checkout is shallow.
      - name: Gauntlet core golden fixtures
        run: |
          # Provenance first: the fixtures must be a fresh derivation from the pinned commit (on
          # main's history, #157) before they are trusted to judge the core.
          git fetch --no-tags --depth=1 origin 81902136ed7c27e99f73517ff43cda8454594185 \
            || { echo "::error::cannot fetch pinned gauntlet ref 81902136 (fixture provenance) — this is a fetch failure, not fixture drift"; exit 1; }
          python3 scripts/tests/derive_gauntlet_fixtures.py --check
          node scripts/tests/run_gauntlet_fixtures.mjs
          python3 scripts/tests/test_gauntlet_core.py

      - name: Agent projection identity
        run: python3 scripts/check-agent-identity.py

      # 2g. Identity-first Market reconciliation. Published projections must
      #     preserve an established chittycanon://capability binding. New
      #     unresolved canonical definitions remain HOLD and cannot be synced.
      - name: Identity-first Market reconciliation
        run: python3 scripts/market-reconcile.py audit

      - name: Materialized overlay idempotency
        run: |
          python3 scripts/market-reconcile.py sync > /tmp/market-reconcile-sync.txt
          if ! git diff --quiet -- capabilities.generated.json marketplace.json; then
            echo "::error::Materialized Market inventories are out of date."
            cat /tmp/market-reconcile-sync.txt
            git diff --stat -- capabilities.generated.json marketplace.json
            git diff -- capabilities.generated.json marketplace.json | head -140
            exit 1
          fi
          echo "✓ Materialized Market inventories are reproducible"

      # 3a. Dispatch idempotency (adversarial review #3): re-running
      #     dispatch.sh sync must not change any projection file. Catches
      #     direct edits to plugins/<plug>/{agents,skills,...}/ that
      #     diverge from canonical/.
      - name: Dispatch idempotency (dispatch.sh sync → no diff)
        run: |
          chmod +x plugins/chittyagent-dispatch/scripts/dispatch.sh plugins/chittyagent-dispatch/scripts/adapters/*.sh
          bash plugins/chittyagent-dispatch/scripts/dispatch.sh sync > /dev/null
          if ! git diff --quiet -- canonical/ plugins/; then
            echo "::error::Direct edits to projection files detected — they diverge from canonical/."
            echo "Run dispatch.sh sync locally and commit, OR edit the canonical source instead."
            echo ""
            echo "--- drift ---"
            git diff --stat -- canonical/ plugins/
            git diff -- canonical/ plugins/ | head -100
            exit 1
          fi
          echo "✓ Projection files are in sync with canonical/"

      # 3a-bis. Drift + orphan matrix. The sync→no-diff gate above catches
      #     content drift on *declared* projections; audit additionally catches
      #     orphan targets (state records a runtime the canonical dropped),
      #     orphan projection files (no canonical backing), and never-synced
      #     declared runtimes. Read-only; exit 1 on any finding.
      - name: Dispatch audit (canonical × runtime drift + orphan matrix)
        run: bash plugins/chittyagent-dispatch/scripts/dispatch.sh audit

      # 3b. Manifest idempotency: regenerating from plugins/ must produce
      #     no diff. Catches hand-edits to .claude-plugin/marketplace.json
      #     and plugin.json changes that weren't propagated to the manifest.
      - name: Manifest idempotency (generate-marketplace.sh → no diff)
        run: |
          bash scripts/generate-marketplace.sh
          if ! git diff --quiet -- .claude-plugin/marketplace.json .agents/plugins/marketplace.json; then
            echo "::error::Marketplace projections are out of sync with plugins/."
            echo "Run 'bash scripts/generate-marketplace.sh' locally and commit both manifests."
            echo ""
            echo "--- drift ---"
            git diff -- .claude-plugin/marketplace.json .agents/plugins/marketplace.json
            exit 1
          fi
          echo "✓ Claude and OpenAI marketplace projections are idempotent"

  # 4. Codex runtime smoke (adversarial review #4): every projected
  #    plugins/<plug>/codex-skills/<name>/SKILL.md must load. Uses real
  #    codex CLI if it ships a load subcommand; otherwise falls back to a
  #    schema-mimic loader and logs the reason.
  codex-smoke:
    name: codex runtime smoke
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Ensure script is executable
        run: chmod +x scripts/runtime-tests/codex-smoke.sh

      - name: Run codex smoke loader
        run: bash scripts/runtime-tests/codex-smoke.sh

      - name: Report skip reason if runtime unavailable
        if: failure()
        run: |
          echo "::warning::codex-smoke reported failures or runtime is unavailable."
          echo "If the schema-mimic loader was used (no real codex skill-load CLI), this job"
          echo "still surfaces parse/shape errors and is treated as a hard failure."

  # 5. OpenClaw runtime smoke (adversarial review #4): every projected
  #    plugins/<plug>/openclaw-agents/<name>.yaml must load. Real openclaw
  #    runtime is not yet publicly distributed — falls back cleanly to
  #    schema-mimic validator that mirrors the openclaw-agent.sh adapter
  #    contract.
  openclaw-smoke:
    name: openclaw runtime smoke
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Ensure script is executable
        run: chmod +x scripts/runtime-tests/openclaw-smoke.sh

      - name: Run openclaw smoke loader
        run: bash scripts/runtime-tests/openclaw-smoke.sh

      - name: Report skip reason if runtime unavailable
        if: failure()
        run: |
          echo "::warning::openclaw-smoke reported failures."
          echo "Real openclaw runtime is not yet on PATH in CI; schema-mimic loader was used."
          echo "Failures indicate adapter or projection drift, not runtime absence."
